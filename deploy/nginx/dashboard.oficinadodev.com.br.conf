server {
    server_name dashboard.oficinadodev.com.br;

    root /var/www/dashboard.oficinadodev.com.br/html/public;
    index index.php;
    autoindex off;
    charset UTF-8;

    access_log /var/log/nginx/dashboard.oficinadodev.com.br.access.log;
    error_log /var/log/nginx/dashboard.oficinadodev.com.br.error.log;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ \.php$ {
        return 404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "memory_limit=256M \n max_execution_time=120 \n upload_max_filesize=20M \n post_max_size=20M";
        fastcgi_read_timeout 120s;
        fastcgi_connect_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~* /\.(?:env|git|htaccess|htpasswd) {
        deny all;
    }

    location ~* /(?:storage|database|docs|deploy|src|views|vendor)/ {
        deny all;
    }

    gzip on;
    gzip_disable "msie6";
    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dashboard.oficinadodev.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.oficinadodev.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = dashboard.oficinadodev.com.br) {
        return 301 https://$host$request_uri;
    }

    server_name dashboard.oficinadodev.com.br;
    listen 80;
    return 404;
}
